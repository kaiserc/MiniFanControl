name: CI Build, Test Verification & Release Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main, "phase*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  sdk-multitarget-build:
    name: Modern .NET SDK Multi-Target (.NET 4.8 & .NET 10.0-windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify Version & Metadata Consistency
        shell: pwsh
        run: |
          ./scripts/sync-version.ps1 -Check
          ./scripts/extract-release-notes.ps1 -Check

      - name: Build net48 Target
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release -f net48

      - name: Build net10.0-windows Target & Run Dedicated Test Assembly
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release -f net10.0-windows
          dotnet build Tests\MiniFanControl.Tests.csproj -c Release -f net10.0-windows
          Tests\bin\Release\net10.0-windows\MiniFanControl.Tests.exe

  standalone-build-and-test:
    name: Standalone .NET 4.8 CSC Build & Automated Self-Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Standalone Binaries & Run Automated Self-Tests
        shell: cmd
        run: |
          set CI=true
          call build-windows.bat

      - name: Validate Community Localization & External Profile JSON Files
        shell: cmd
        run: |
          minifan-helper.exe validate-lang
          minifan-helper.exe validate-profiles

      - name: Install Inno Setup (for Installer Compilation)
        shell: cmd
        run: |
          choco install innosetup --no-progress

      - name: Verify Automated Release Packaging
        shell: cmd
        run: |
          set CI=true
          call package-release.bat

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MiniFanControl-Release-Artifacts
          path: |
            dist/*-Portable.zip
            dist/*-Setup-*.exe
            dist/SHA256SUMS.txt

  publish-release:
    name: Publish Official GitHub Release
    needs: [ sdk-multitarget-build, standalone-build-and-test ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MiniFanControl-Release-Artifacts
          path: dist

      - name: Generate Verifiable Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*-Portable.zip
            dist/*-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Prepare Curated Release Notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/extract-release-notes.ps1 -Tag "$env:RELEASE_TAG" -OutputPath "release-body.md"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*-Portable.zip
            dist/*-Setup-*.exe
            dist/SHA256SUMS.txt
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
