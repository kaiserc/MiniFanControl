name: CI Build & Test Verification

on:
  push:
    branches: [ main, "phase*" ]
  pull_request:
    branches: [ main ]

jobs:
  sdk-multitarget-build:
    name: Modern .NET SDK Multi-Target (.NET 4.8 & .NET 10.0-windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build net48 Target
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release -f net48

      - name: Build net10.0-windows Target
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release -f net10.0-windows

  standalone-build-and-test:
    name: Standalone .NET 4.8 CSC Build & 32 Automated Self-Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Standalone Binaries & Run Self-Test Suite
        shell: cmd
        run: |
          set CI=true
          call build-windows.bat > build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type build.log
          if defined GITHUB_STEP_SUMMARY (
            echo ### Standalone Build and Test Log >> "%GITHUB_STEP_SUMMARY%"
            echo ``` >> "%GITHUB_STEP_SUMMARY%"
            type build.log >> "%GITHUB_STEP_SUMMARY%"
            echo ``` >> "%GITHUB_STEP_SUMMARY%"
          )
          if %BUILD_EXIT% neq 0 exit /b %BUILD_EXIT%

      - name: Verify Automated Release Packaging
        shell: cmd
        run: |
          set CI=true
          call package-release.bat > package.log 2>&1
          set PKG_EXIT=%ERRORLEVEL%
          type package.log
          if defined GITHUB_STEP_SUMMARY (
            echo ### Release Packaging Log >> "%GITHUB_STEP_SUMMARY%"
            echo ``` >> "%GITHUB_STEP_SUMMARY%"
            type package.log >> "%GITHUB_STEP_SUMMARY%"
            echo ``` >> "%GITHUB_STEP_SUMMARY%"
          )
          if %PKG_EXIT% neq 0 exit /b %PKG_EXIT%

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniFanControl-Release-Archive
          path: dist/MiniFanControl-v*.zip
