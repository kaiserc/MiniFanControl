name: CI Build, Test Verification & Release Pipeline

on:
  push:
    branches: [ main, "phase*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  sdk-multitarget-build:
    name: Modern .NET SDK Multi-Target (.NET 4.8 & .NET 10.0-windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build net48 Target
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release -f net48

      - name: Build net10.0-windows Target
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release -f net10.0-windows

  standalone-build-and-test:
    name: Standalone .NET 4.8 CSC Build & 49 Automated Self-Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Standalone Binaries & Run 49 Self-Tests
        shell: cmd
        run: |
          set CI=true
          call build-windows.bat

      - name: Verify Automated Release Packaging
        shell: cmd
        run: |
          set CI=true
          call package-release.bat

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniFanControl-Release-Archive
          path: dist/MiniFanControl-v*.zip

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MiniFanControl-v*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
