name: CI Build & Test Verification

on:
  push:
    branches: [ main, "phase*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Windows x64 Build & Self-Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Modern SDK Multi-Target (.NET 4.8 & .NET 8.0-windows)
        shell: cmd
        run: |
          dotnet build MiniFanControl.csproj -c Release

      - name: Build Standalone Executables & Run Self-Tests (.NET 4.8 via csc)
        shell: cmd
        run: |
          call build-windows.bat

      - name: Verify Automated Release Pipeline
        shell: cmd
        run: |
          call package-release.bat

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniFanControl-Release-Archive
          path: dist/MiniFanControl-v*.zip
