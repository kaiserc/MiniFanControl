<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="glowCyan" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Red/Radeon Glow -->
    <radialGradient id="glowRed" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Pill Gradients -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Fan Blade & Accents -->
    <linearGradient id="fanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Fill & Ambient Glows -->
  <rect x="0" y="0" width="1280" height="420" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="1280" height="420" fill="url(#glowCyan)" />
  <rect x="0" y="0" width="1280" height="420" fill="url(#glowRed)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.15">
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1160" y1="0" x2="1160" y2="420" />
  </g>

  <!-- Top / Bottom Accent Border Lines -->
  <rect x="0" y="0" width="1280" height="3" fill="#38BDF8" opacity="0.6" />
  <rect x="0" y="417" width="1280" height="3" fill="#6366F1" opacity="0.4" />

  <!-- 2. Left Hero Icon (Mini PC Chassis with Glowing Fan) -->
  <g transform="translate(60, 48) scale(0.64)">
    <!-- Chassis Shadow -->
    <rect x="42" y="390" width="428" height="96" rx="42" fill="#000000" opacity="0.6" />

    <!-- 3D Lower Chassis Body -->
    <rect x="30" y="280" width="452" height="186" rx="80" fill="#0F172A" stroke="#475569" stroke-width="6" />

    <!-- Front I/O: Power Button & Ports -->
    <circle cx="112" cy="422" r="20" fill="#EF4444" opacity="0.35" filter="url(#softGlow)" />
    <circle cx="112" cy="422" r="14" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="175" y="413" width="46" height="18" rx="4" fill="#0284C7" stroke="#64748B" stroke-width="2" />
    <rect x="238" y="413" width="46" height="18" rx="4" fill="#0284C7" stroke="#64748B" stroke-width="2" />
    <rect x="304" y="415" width="34" height="14" rx="7" fill="#0B0F19" stroke="#94A3B8" stroke-width="2" />

    <!-- Top Lid Deck -->
    <rect x="30" y="34" width="452" height="365" rx="76" fill="#1E293B" stroke="#64748B" stroke-width="6" />
    <rect x="38" y="42" width="436" height="349" rx="68" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Recessed Circular Fan Bay -->
    <circle cx="256" cy="208" r="148" fill="#070A10" stroke="#334155" stroke-width="6" />

    <!-- 270-Degree Colored Gauge Arc -->
    <circle cx="256" cy="208" r="132" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="622" stroke-dashoffset="155" transform="rotate(135 256 208)" />
    <circle cx="256" cy="208" r="132" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="622" stroke-dashoffset="240" transform="rotate(135 256 208)" filter="url(#softGlow)" />

    <!-- 6 Fan Blades -->
    <g>
      <path d="M 256 208 Q 236 120 256 94 Q 284 100 274 196 Z" fill="url(#fanGrad)" stroke="#0284C7" stroke-width="1.5" />
      <g transform="rotate(60 256 208)"><path d="M 256 208 Q 236 120 256 94 Q 284 100 274 196 Z" fill="url(#fanGrad)" stroke="#0284C7" stroke-width="1.5" /></g>
      <g transform="rotate(120 256 208)"><path d="M 256 208 Q 236 120 256 94 Q 284 100 274 196 Z" fill="url(#fanGrad)" stroke="#0284C7" stroke-width="1.5" /></g>
      <g transform="rotate(180 256 208)"><path d="M 256 208 Q 236 120 256 94 Q 284 100 274 196 Z" fill="url(#fanGrad)" stroke="#0284C7" stroke-width="1.5" /></g>
      <g transform="rotate(240 256 208)"><path d="M 256 208 Q 236 120 256 94 Q 284 100 274 196 Z" fill="url(#fanGrad)" stroke="#0284C7" stroke-width="1.5" /></g>
      <g transform="rotate(300 256 208)"><path d="M 256 208 Q 236 120 256 94 Q 284 100 274 196 Z" fill="url(#fanGrad)" stroke="#0284C7" stroke-width="1.5" /></g>
    </g>

    <!-- Center Fan Hub -->
    <circle cx="256" cy="208" r="42" fill="#334155" stroke="#64748B" stroke-width="4" filter="url(#softGlow)" />
    <circle cx="256" cy="208" r="32" fill="#0B0F19" stroke="#38BDF8" stroke-width="2" />
    <circle cx="256" cy="208" r="12" fill="#38BDF8" opacity="0.9" />

    <!-- AMD Badge Underneath -->
    <rect x="196" y="335" width="120" height="34" rx="8" fill="#DC2626" stroke="#F87171" stroke-width="2" />
    <text x="232" y="359" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="2">AMD</text>
  </g>

  <!-- 3. Typography Section -->
  <!-- Top Category Kicker -->
  <g transform="translate(430, 95)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="14" cy="13" r="5" fill="#38BDF8" filter="url(#softGlow)" />
    <text x="28" y="17.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">HARDWARE EC ENGINE</text>
  </g>

  <!-- Main Headline Title -->
  <text x="430" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="62" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
    MiniFanControl
  </text>

  <!-- Subtitle -->
  <text x="432" y="210" font-family="'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
    Native EC Fan Curves &amp; Telemetry Suite for AMD Ryzen Mini PCs
  </text>
  <text x="432" y="235" font-family="'Segoe UI', Roboto, sans-serif"
        font-size="13" font-weight="400" fill="#64748B">
    Supports GMKtec NucBox K12, K8 Plus, K11, EVO-X1 &amp; Ryzen AI 9 HX 370 (ITE IT5570E @ 0xFE0B0400)
  </text>

  <!-- 4. Feature Badges Row -->
  <g transform="translate(432, 275)">
    <!-- Badge 1: Dual-Fan -->
    <g>
      <rect x="0" y="0" width="186" height="42" rx="10" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="22" cy="21" r="9" fill="#0284C7" />
      <text x="18" y="25" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">🌀</text>
      <text x="40" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Dual-Fan Curves</text>
      <text x="40" y="34" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94A3B8">APU + Sys / RAM / SSD</text>
    </g>

    <!-- Badge 2: In-Game OSD Studio -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="186" height="42" rx="10" fill="url(#pillGrad)" stroke="#818CF8" stroke-width="1.5" />
      <circle cx="22" cy="21" r="9" fill="#4F46E5" />
      <text x="17" y="25" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">🎮</text>
      <text x="40" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">CapFrameX OSD</text>
      <text x="40" y="34" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94A3B8">Live Graphs &amp; 4K Tiers</text>
    </g>

    <!-- Badge 3: Global Mutex -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="186" height="42" rx="10" fill="url(#pillGrad)" stroke="#34D399" stroke-width="1.5" />
      <circle cx="22" cy="21" r="9" fill="#059669" />
      <text x="17" y="25" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">🛡️</text>
      <text x="40" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Global Mutex Safe</text>
      <text x="40" y="34" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94A3B8">HWiNFO / CFX Coexist</text>
    </g>

    <!-- Badge 4: Zero Dependencies -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="186" height="42" rx="10" fill="url(#pillGrad)" stroke="#FB7185" stroke-width="1.5" />
      <circle cx="22" cy="21" r="9" fill="#E11D48" />
      <text x="17" y="25" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">⚡</text>
      <text x="40" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Zero Dependencies</text>
      <text x="40" y="34" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94A3B8">Native Windows .NET</text>
    </g>
  </g>
</svg>
